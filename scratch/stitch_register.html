<div class="absolute inset-0 bg-surface mix-blend-overlay opacity-30"></div>
</div>
<!-- Right Form Canvas -->
<main class="w-full md:w-7/12 lg:w-1/2 flex flex-col min-h-screen relative">
<!-- Transactional "Back" / Simple Nav (Suppressed global nav as per mandate) -->
<nav class="absolute top-0 left-0 w-full p-8 flex justify-between items-center z-10">
<a class="font-headline font-bold text-xl tracking-tighter text-on-surface hover:opacity-70 transition-opacity" href="#">
                ATELIER
            </a>
<a class="flex items-center gap-2 text-sm font-label font-medium text-on-surface-variant hover:text-primary transition-colors group" href="#">
<span class="material-symbols-outlined text-[20px] group-hover:-translate-x-1 transition-transform">arrow_left_alt</span>
                Return to Canvas
            </a>
</nav>
<!-- Form Container -->
<div class="flex-grow flex flex-col justify-center px-8 sm:px-16 lg:px-24 xl:px-32 py-24">
<div class="max-w-md w-full mx-auto md:mx-0">
<header class="mb-12">
<h1 class="font-headline text-[2.5rem] md:text-[3rem] leading-none font-bold tracking-tight text-on-surface mb-4">
                        Join the <br/> Atelier.
                    </h1>
<p class="font-body text-base text-on-surface-variant leading-relaxed pr-8">
                        Create an account to curate your personal lookbook and access exclusive editorial collections.
                    </p>
</header>
<form action="#" class="space-y-8" method="POST">
<!-- Input Field: Name -->
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant text-on-surface font-body text-base px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder-transparent" id="fullName" name="fullName" placeholder="Full Name" required="" type="text"/>
<label class="absolute left-0 top-3 text-on-surface-variant font-label text-sm uppercase tracking-widest transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3 peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-focus:-top-5 peer-focus:text-[0.65rem] peer-focus:text-primary peer-focus:uppercase peer-focus:tracking-widest" for="fullName">
                            Full Name
                        </label>
</div>
<!-- Input Field: Email -->
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant text-on-surface font-body text-base px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder-transparent" id="emailAddress" name="emailAddress" placeholder="Email Address" required="" type="email"/>
<label class="absolute left-0 top-3 text-on-surface-variant font-label text-sm uppercase tracking-widest transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3 peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-focus:-top-5 peer-focus:text-[0.65rem] peer-focus:text-primary peer-focus:uppercase peer-focus:tracking-widest" for="emailAddress">
                            Email Address
                        </label>
</div>
<!-- Input Field: Password -->
<div class="relative group">
<input class="peer w-full bg-transparent border-0 border-b border-outline-variant text-on-surface font-body text-base px-0 py-3 focus:ring-0 focus:border-primary transition-colors placeholder-transparent" id="password" name="password" placeholder="Password" required="" type="password"/>
<label class="absolute left-0 top-3 text-on-surface-variant font-label text-sm uppercase tracking-widest transition-all peer-placeholder-shown:text-sm peer-placeholder-shown:top-3 peer-placeholder-shown:normal-case peer-placeholder-shown:tracking-normal peer-focus:-top-5 peer-focus:text-[0.65rem] peer-focus:text-primary peer-focus:uppercase peer-focus:tracking-widest" for="password">
                            Password
                        </label>
</div>
<!-- Actions -->
<div class="pt-6 flex flex-col gap-6">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-label text-sm uppercase tracking-widest py-4 rounded-DEFAULT hover:opacity-90 transition-all duration-300 shadow-[0_24px_48px_rgba(27,28,28,0.06)] flex justify-center items-center gap-3 group" type="submit">
                            Create Account
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">east</span>
</button>
<div class="text-center">
<span class="font-body text-sm text-on-surface-variant">Already have an account?</span>
<a class="font-label text-sm font-semibold text-on-surface underline underline-offset-4 decoration-outline-variant hover:decoration-primary transition-colors ml-2" href="#">
                                Log In
                            </a>
</div>
</div>
</form>
</div>
</div>
<!-- Transactional Footer -->
<div class="p-8 text-center md:text-left mt-auto">
<p class="font-body text-xs text-outline-variant">
