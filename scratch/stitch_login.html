<body class="bg-surface text-on-surface min-h-screen antialiased">
<main class="min-h-screen flex flex-col lg:flex-row">
<!-- Left Side Image -->
<div class="hidden lg:block lg:w-1/2 relative overflow-hidden bg-surface-container-high">
<img alt="High-end fashion editorial backstage with models blurred in motion, soft natural lighting, warm terracotta undertones, subtle grain texture" class="w-full h-full object-cover opacity-90 mix-blend-multiply" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMv-prh0BGTrgYzRs_6fX6CoVqq1vCCNlvkxoFnewsWJk1QP9iYQwlHUH_UBDiOyDl5f2UR5tUyIRGWY1lPEg5-rx-q9DmL90mzGDlJkexebRJsiQFuQfcOSnylvLl5fygVrqrSA467H2Mj_PdDRjPosZpP4Vd9uKr7vsk3jpX6LRP24UE8Ae8emdi2BKw1qN03Tj-H_GKppXaIXM1vVlwTUxO0nv4SC0nYrnjpTHo4eJ70uD-pWHMThWYe4q3oNA4yL1wR_76R_vg"/>
<div class="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent"></div>
</div>
<!-- Right Side Form -->
<div class="flex-grow lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 relative bg-surface">
<div class="relative z-10 w-full max-w-md">
<div class="mb-12">
<a class="inline-block" href="#">
<span class="text-3xl font-bold tracking-tighter text-on-surface font-headline uppercase">ATELIER</span>
</a>
<p class="mt-3 text-on-surface-variant font-body text-sm tracking-wide">Enter your personal canvas.</p>
</div>
<div class="mb-10">
<h1 class="text-4xl font-headline font-bold text-on-surface tracking-tight">Sign In</h1>
</div>
<form action="#" class="space-y-8" method="POST">
<div class="space-y-2 relative group">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2 group-focus-within:text-primary transition-colors" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/60 px-0 py-3 text-on-surface font-body text-base focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/40" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2 relative group">
<div class="flex justify-between items-end mb-2">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant group-focus-within:text-primary transition-colors" for="password">Password</label>
<a class="text-xs font-label text-primary hover:text-primary-container transition-all duration-300 uppercase tracking-widest relative after:content-[''] after:absolute after:w-full after:scale-x-0 after:h-[1px] after:bottom-0 after:left-0 after:bg-primary after:origin-bottom-right after:transition-transform hover:after:scale-x-100 hover:after:origin-bottom-left" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/60 px-0 py-3 text-on-surface font-body text-base focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors p-2" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-6">
<button class="w-full bg-primary text-on-primary py-4 px-8 font-label text-sm uppercase tracking-widest hover:bg-primary-container hover:shadow-lg hover:-translate-y-0.5 transition-all duration-300 flex items-center justify-center gap-3" type="submit">
                            Login
                            <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-12">
<p class="text-sm font-body text-on-surface-variant">
                        New to Atelier? 
                        <a class="text-primary hover:text-primary-container font-semibold transition-all duration-300 ml-1 relative after:content-[''] after:absolute after:w-full after:scale-x-100 after:h-[1px] after:bottom-0 after:left-0 after:bg-primary/30 after:transition-transform hover:after:bg-primary" href="#">Create an account</a>
</p>
</div>
<div class="mt-16">
<p class="text-xs font-label text-on-surface-variant uppercase tracking-widest opacity-50">
                    © 2024 DIGITAL ATELIER
                </p>
</div>
