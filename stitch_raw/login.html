<style>
        body { font-family: 'Manrope', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Epilogue', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col antialiased">
<main class="flex-grow flex items-center justify-center p-6 md:p-12 lg:p-24 relative overflow-hidden">
<div class="absolute inset-0 z-0">
<img alt="background" class="w-full h-full object-cover opacity-40 mix-blend-multiply filter grayscale" data-alt="High-end fashion editorial backstage with models blurred in motion, soft natural lighting, warm terracotta undertones, subtle grain texture" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAMv-prh0BGTrgYzRs_6fX6CoVqq1vCCNlvkxoFnewsWJk1QP9iYQwlHUH_UBDiOyDl5f2UR5tUyIRGWY1lPEg5-rx-q9DmL90mzGDlJkexebRJsiQFuQfcOSnylvLl5fygVrqrSA467H2Mj_PdDRjPosZpP4Vd9uKr7vsk3jpX6LRP24UE8Ae8emdi2BKw1qN03Tj-H_GKppXaIXM1vVlwTUxO0nv4SC0nYrnjpTHo4eJ70uD-pWHMThWYe4q3oNA4yL1wR_76R_vg"/>
<div class="absolute inset-0 bg-gradient-to-tr from-surface via-surface/90 to-surface/40"></div>
</div>
<div class="relative z-10 w-full max-w-md">
<div class="text-center mb-12">
<a class="inline-block" href="#">
<span class="text-3xl font-bold tracking-tighter text-on-surface font-headline uppercase">ATELIER</span>
</a>
<p class="mt-4 text-on-surface-variant font-body text-sm tracking-wide">Enter your personal canvas.</p>
</div>
<div class="bg-surface-container-lowest/80 backdrop-blur-xl p-10 md:p-12 shadow-[0px_24px_48px_rgba(27,28,28,0.06)] relative border-t-4 border-primary">
<h1 class="text-3xl font-headline font-bold text-on-surface mb-8 tracking-tight">Sign In</h1>
<form action="#" class="space-y-8" method="POST">
<div class="space-y-2 relative">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 px-0 py-3 text-on-surface font-body text-base focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/40" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2 relative">
<div class="flex justify-between items-end mb-2">
<label class="block text-xs font-label uppercase tracking-widest text-on-surface-variant" for="password">Password</label>
<a class="text-xs font-label text-primary hover:text-primary-container transition-colors uppercase tracking-widest border-b border-transparent hover:border-primary" href="#">Forgot?</a>
</div>
<div class="relative">
<input class="w-full bg-transparent border-0 border-b border-outline-variant/50 px-0 py-3 text-on-surface font-body text-base focus:ring-0 focus:border-primary transition-colors placeholder:text-outline-variant/40" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant transition-colors p-2" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="pt-4">
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary py-4 px-8 font-label text-sm uppercase tracking-widest hover:opacity-90 transition-opacity flex items-center justify-center gap-3" type="submit">
                            Login
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<div class="mt-10 text-center">
<p class="text-sm font-body text-on-surface-variant">
                        New to Atelier? 
                        <a class="text-primary hover:text-primary-container font-semibold transition-colors ml-1 border-b border-primary/30 hover:border-primary pb-0.5" href="#">Create an account</a>
</p>
</div>
</div>
<div class="mt-12 text-center">
<p class="text-xs font-label text-on-surface-variant uppercase tracking-widest opacity-60">
                    © 2024 DIGITAL ATELIER
                </p>
</div>
</div>
</main>
</body></html>
